<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprilTag Detection Benchmark</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button.start {
            background: #00d46a;
            color: #000;
        }
        .controls button.stop {
            background: #ff4757;
            color: #fff;
        }
        .controls button.reset {
            background: #ffa502;
            color: #000;
        }
        .controls button:hover {
            transform: scale(1.05);
        }
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .source-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2d2d44;
            padding: 8px 16px;
            border-radius: 6px;
        }
        .source-toggle label {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .source-toggle input[type="radio"] {
            display: none;
        }
        .source-toggle input[type="radio"]:checked + label {
            background: #00d4ff;
            color: #000;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            padding: 15px;
            background: #2d2d44;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat .value {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 15px;
        }
        .camera-tile {
            background: #2d2d44;
            border-radius: 8px;
            overflow: hidden;
        }
        .camera-tile .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #3d3d5c;
        }
        .camera-tile .name {
            font-weight: bold;
        }
        .camera-tile .name small {
            font-weight: normal;
            font-size: 10px;
            color: #888;
            display: block;
        }
        .camera-tile .snapshot-badge {
            font-size: 9px;
            background: #00d46a;
            color: #000;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 5px;
        }
        @keyframes pulse-success {
            0% { box-shadow: 0 0 0 0 rgba(0, 212, 106, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(0, 212, 106, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 212, 106, 0); }
        }
        @keyframes pulse-fail {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
        @keyframes flash-border {
            0% { border-color: #00d4ff; }
            100% { border-color: transparent; }
        }
        .camera-tile {
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .camera-tile.updated {
            animation: pulse-success 0.4s ease-out, flash-border 0.4s ease-out;
        }
        .camera-tile.failed {
            animation: pulse-fail 0.5s ease-out;
            border-color: #ff4757;
        }
        .camera-tile .pass-results {
            display: flex;
            gap: 4px;
            padding: 4px 10px;
            background: #1a1a2e;
            font-size: 11px;
            font-family: monospace;
        }
        .camera-tile .pass-results span {
            padding: 2px 6px;
            border-radius: 3px;
            background: #2d2d44;
            color: #888;
        }
        .camera-tile .pass-results span.current {
            background: #00d4ff;
            color: #000;
        }
        .camera-tile .pass-results span.mismatch {
            background: #ff4757;
            color: #fff;
        }
        .camera-tile .timing {
            font-size: 12px;
            color: #00d4ff;
        }
        .camera-tile .resolution {
            font-size: 12px;
            color: #aaa;
        }
        .camera-tile img {
            width: 100%;
            display: block;
            min-height: 200px;
            background: #1a1a2e;
        }
        .camera-tile .error {
            padding: 40px;
            text-align: center;
            color: #ff4757;
        }
        .pass-indicator {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 10px;
        }
        .progress-container {
            width: 300px;
            height: 8px;
            background: #2d2d44;
            border-radius: 4px;
            margin: 8px auto;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00d46a);
            border-radius: 4px;
            width: 0%;
            transition: width 0.15s ease-out;
        }
        .progress-bar.complete {
            background: #00d46a;
        }
        .nvr-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nvr-control {
            background: #2d2d44;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 140px;
        }
        .nvr-control.disabled {
            opacity: 0.5;
        }
        .nvr-control .nvr-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nvr-control .nvr-name {
            font-weight: bold;
            color: #00d4ff;
        }
        .nvr-control .nvr-count {
            font-size: 11px;
            color: #888;
        }
        .nvr-control label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
        }
        .nvr-control input[type="checkbox"] {
            cursor: pointer;
        }
        .camera-tile .tag-details {
            padding: 8px 10px;
            background: #1a1a2e;
            font-size: 11px;
            max-height: 120px;
            overflow-y: auto;
        }
        .camera-tile .tag-details .tag-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 6px;
            margin-bottom: 2px;
            background: #2d2d44;
            border-radius: 3px;
            border-left: 3px solid #888;
        }
        .camera-tile .tag-details .tag-item.Fiducial { border-left-color: #00ff00; }
        .camera-tile .tag-details .tag-item.Forklift { border-left-color: #ffa500; }
        .camera-tile .tag-details .tag-item.Pallet { border-left-color: #ff00ff; }
        .camera-tile .tag-details .tag-item.Pallet52h13 { border-left-color: #00ffff; }
        .camera-tile .tag-details .tag-id {
            font-weight: bold;
            color: #fff;
        }
        .camera-tile .tag-details .tag-family {
            color: #888;
            font-size: 10px;
        }
        .camera-tile .tag-details .tag-margin {
            color: #00d4ff;
        }
        .camera-tile .tag-details .no-tags {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>AprilTag Detection Benchmark</h1>

    <div class="controls">
        <button class="start" id="startBtn" onclick="startTest()">Start Test</button>
        <button class="stop" id="stopBtn" onclick="stopTest()" disabled>Stop</button>
        <button class="reset" onclick="resetStats()">Reset Stats</button>
    </div>
    <div class="nvr-controls" id="nvrControls"></div>

    <div class="pass-indicator" id="passIndicator">Pass: 0 / 3</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <div class="value" id="statFrames">0</div>
            <div class="label">Frames</div>
        </div>
        <div class="stat">
            <div class="value" id="statAvgQueue">-</div>
            <div class="label">Queue (ms)</div>
        </div>
        <div class="stat">
            <div class="value" id="statAvgCapture">-</div>
            <div class="label">Capture (ms)</div>
        </div>
        <div class="stat">
            <div class="value" id="statAvgOverhead">-</div>
            <div class="label">Overhead (ms)</div>
        </div>
        <div class="stat">
            <div class="value" id="statAvgDetect">-</div>
            <div class="label">Detect (ms)</div>
        </div>
        <div class="stat">
            <div class="value" id="statTags">0</div>
            <div class="label">Tags</div>
        </div>
        <div class="stat">
            <div class="value" id="statFps">-</div>
            <div class="label">FPS</div>
        </div>
    </div>

    <div class="camera-grid" id="cameraGrid"></div>

    <script>
        // Use relative URLs when served from /test endpoint, absolute otherwise
        const DETECTION_SERVICE = window.location.port === '8002' ? '' : 'http://localhost:8002';
        const NUM_PASSES = 3;

        // Camera list - will be populated from API
        let cameras = [];
        let cameraIndex = {};  // nvr/channel -> idx mapping
        let nvrList = [];  // List of unique NVR IDs
        let nvrConfig = {};  // nvr_id -> { enabled: bool, snapshots: bool }

        let running = false;
        let currentPassId = null;
        let currentPassNum = 0;
        let pollInterval = null;
        let frameCount = 0;
        let totalQueueMs = 0;
        let totalCaptureMs = 0;
        let totalOverheadMs = 0;
        let totalDetectMs = 0;
        let totalTags = 0;
        let startTime = null;
        let cameraPassResults = {};  // idx -> [tags per pass]
        let cameraTagDetails = {};  // idx -> [{id, family, confidence}, ...] from latest successful pass
        let loadedImages = {};  // passId/nvr/channel -> true (track which images we've loaded)

        // Build NVR control panel
        function buildNvrControls() {
            const container = document.getElementById('nvrControls');
            container.innerHTML = '';

            // Get unique NVRs and count cameras per NVR
            const nvrCounts = {};
            const nvrHasSnap = {};
            cameras.forEach(cam => {
                nvrCounts[cam.nvr] = (nvrCounts[cam.nvr] || 0) + 1;
                if (cam.snapshot) nvrHasSnap[cam.nvr] = true;
            });
            nvrList = Object.keys(nvrCounts).sort();

            // Initialize config if not set
            nvrList.forEach(nvr => {
                if (!nvrConfig[nvr]) {
                    nvrConfig[nvr] = { enabled: true, snapshots: false };
                }
            });

            // Build controls
            nvrList.forEach(nvr => {
                const cfg = nvrConfig[nvr];
                const count = nvrCounts[nvr];
                const hasSnap = nvrHasSnap[nvr];

                const div = document.createElement('div');
                div.className = 'nvr-control' + (cfg.enabled ? '' : ' disabled');
                div.id = `nvr-ctrl-${nvr}`;

                div.innerHTML = `
                    <div class="nvr-header">
                        <input type="checkbox" id="nvr-enable-${nvr}" ${cfg.enabled ? 'checked' : ''} onchange="toggleNvr('${nvr}')">
                        <span class="nvr-name">${nvr}</span>
                        <span class="nvr-count">(${count})</span>
                    </div>
                    ${hasSnap ? `<label><input type="checkbox" id="nvr-snap-${nvr}" ${cfg.snapshots ? 'checked' : ''} onchange="toggleNvrSnap('${nvr}')" ${cfg.enabled ? '' : 'disabled'}> Snapshots</label>` : ''}
                `;
                container.appendChild(div);
            });

            updateStartButton();
        }

        // Toggle NVR enabled state
        function toggleNvr(nvr) {
            const cb = document.getElementById(`nvr-enable-${nvr}`);
            nvrConfig[nvr].enabled = cb.checked;

            const ctrl = document.getElementById(`nvr-ctrl-${nvr}`);
            ctrl.className = 'nvr-control' + (cb.checked ? '' : ' disabled');

            const snapCb = document.getElementById(`nvr-snap-${nvr}`);
            if (snapCb) snapCb.disabled = !cb.checked;

            buildGrid();
            updateStartButton();
        }

        // Toggle NVR snapshot setting
        function toggleNvrSnap(nvr) {
            const cb = document.getElementById(`nvr-snap-${nvr}`);
            nvrConfig[nvr].snapshots = cb.checked;
        }

        // Update start button state
        function updateStartButton() {
            const anyEnabled = nvrList.some(nvr => nvrConfig[nvr].enabled);
            document.getElementById('startBtn').disabled = !anyEnabled || running;
        }

        // Get enabled cameras based on NVR config
        function getEnabledCameras() {
            return cameras.filter(cam => nvrConfig[cam.nvr]?.enabled);
        }

        // Build camera tiles (only for enabled NVRs)
        function buildGrid() {
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = '';
            cameraIndex = {};

            const enabledCameras = getEnabledCameras();

            enabledCameras.forEach((cam, idx) => {
                const key = `${cam.nvr}/${cam.channel}`;
                cameraIndex[key] = idx;

                const tile = document.createElement('div');
                tile.className = 'camera-tile';
                tile.id = `tile-${idx}`;
                const snapBadge = cam.snapshot && nvrConfig[cam.nvr]?.snapshots ? '<span class="snapshot-badge">SNAP</span>' : '';
                const passSlots = Array(NUM_PASSES).fill('<span>-</span>').join('');
                tile.innerHTML = `
                    <div class="header">
                        <span class="name">${cam.name}${snapBadge}<small>${cam.nvr} ch${cam.channel}</small></span>
                        <span class="resolution" id="res-${idx}">--</span>
                        <span class="timing" id="timing-${idx}">--</span>
                    </div>
                    <img id="img-${idx}" src="" alt="Camera ${idx}">
                    <div class="pass-results" id="passes-${idx}">${passSlots}</div>
                    <div class="tag-details" id="tags-${idx}"></div>
                `;
                cameraPassResults[idx] = [];
                cameraTagDetails[idx] = [];
                grid.appendChild(tile);
            });
        }

        // Process results from a pass poll
        function processPassResults(passId, results) {
            for (const r of results) {
                const key = `${r.nvr}/${r.channel}`;
                const idx = cameraIndex[key];
                if (idx === undefined) continue;

                const tile = document.getElementById(`tile-${idx}`);
                const timing = document.getElementById(`timing-${idx}`);
                const img = document.getElementById(`img-${idx}`);
                const imageKey = `${passId}/${key}`;

                if (r.status === 'done' && !loadedImages[imageKey]) {
                    // Load image once
                    loadedImages[imageKey] = true;
                    img.src = `${DETECTION_SERVICE}/pass/${passId}/image/${r.nvr}/${r.channel}`;

                    // Update resolution (with low-res warning and detect dimensions)
                    const resEl = document.getElementById(`res-${idx}`);
                    if (resEl && r.resolution) {
                        let resText = r.resolution;
                        if (r.detect_res) resText += ` → ${r.detect_res}`;
                        if (r.low_res) resText += ' LOW RES';
                        resEl.textContent = resText;
                        if (r.low_res) resEl.style.color = '#ff4757';
                    }

                    // Update timing display (show breakdown if available)
                    const queue = r.queue_ms ?? '-';
                    const capture = r.capture_ms ?? '-';
                    const overhead = r.overhead_ms ?? '-';
                    timing.textContent = `q:${queue} cap:${capture} oh:${overhead} det:${r.detect_ms}ms | ${r.tags}`;

                    // Track stats
                    totalQueueMs += r.queue_ms || 0;
                    totalCaptureMs += r.capture_ms || 0;
                    totalOverheadMs += r.overhead_ms || 0;
                    totalDetectMs += r.detect_ms || 0;
                    frameCount++;

                    // Record pass result for this camera
                    if (cameraPassResults[idx].length < currentPassNum) {
                        // Fill any skipped passes (shouldn't happen)
                        while (cameraPassResults[idx].length < currentPassNum - 1) {
                            cameraPassResults[idx].push('X');
                        }
                    }
                    if (cameraPassResults[idx].length === currentPassNum - 1) {
                        cameraPassResults[idx].push(r.tags);
                        updatePassDisplay(idx);
                    }

                    // Store tag details from this successful pass
                    if (r.tag_details) {
                        cameraTagDetails[idx] = r.tag_details;
                        updateTagDetails(idx);
                    }

                    // Animate success
                    tile.classList.remove('updated', 'failed');
                    void tile.offsetWidth;
                    tile.classList.add('updated');

                } else if (r.status === 'failed' && !loadedImages[imageKey]) {
                    loadedImages[imageKey] = true;
                    timing.textContent = r.error || 'failed';

                    // Record failure
                    if (cameraPassResults[idx].length === currentPassNum - 1) {
                        cameraPassResults[idx].push('X');
                        updatePassDisplay(idx);
                    }

                    tile.classList.remove('updated', 'failed');
                    void tile.offsetWidth;
                    tile.classList.add('failed');
                }
            }

            updateStats();
        }

        // Poll for pass results (self-scheduling via setTimeout to prevent overlap)
        async function pollPassResults() {
            if (!currentPassId || !running) return;

            try {
                const response = await fetch(`${DETECTION_SERVICE}/pass/${currentPassId}/results`);
                if (!response.ok) {
                    schedulePoll();
                    return;
                }

                const data = await response.json();
                processPassResults(currentPassId, data.results);

                // Update progress bar
                const completed = data.completed + data.failed;
                const total = data.total;
                const progressPercent = total > 0 ? (completed / total) * 100 : 0;
                document.getElementById('progressBar').style.width = `${progressPercent}%`;

                // Check if pass is done
                if (data.done) {
                    // Start next pass or finish
                    if (currentPassNum < NUM_PASSES && running) {
                        document.getElementById('passIndicator').textContent = `Pass: ${currentPassNum} / ${NUM_PASSES}`;
                        document.getElementById('progressBar').style.width = '0%';
                        await startNextPass();
                    } else {
                        // All passes complete
                        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                        document.getElementById('passIndicator').textContent = `Pass: ${NUM_PASSES} / ${NUM_PASSES} - COMPLETE (${elapsed}s)`;
                        document.querySelector('.progress-container').style.display = 'none';
                        stopTest();
                    }
                } else {
                    // Not done yet - schedule next poll
                    schedulePoll();
                }
            } catch (e) {
                console.error('Poll error:', e);
                schedulePoll();
            }
        }

        function schedulePoll() {
            if (pollInterval) clearTimeout(pollInterval);
            pollInterval = setTimeout(pollPassResults, 500);
        }

        // Start a single pass
        async function startNextPass() {
            if (!running) return;

            try {
                // Build NVR config for request
                const nvrs = {};
                nvrList.forEach(nvr => {
                    if (nvrConfig[nvr].enabled) {
                        nvrs[nvr] = {
                            enabled: true,
                            snapshots: nvrConfig[nvr].snapshots
                        };
                    }
                });

                const response = await fetch(`${DETECTION_SERVICE}/pass/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nvrs })
                });
                if (!response.ok) {
                    console.error('Failed to start pass');
                    return;
                }

                const data = await response.json();
                currentPassId = data.passId;
                currentPassNum++;

                document.getElementById('passIndicator').textContent = `Pass: ${currentPassNum} / ${NUM_PASSES} (running)`;

                // Start polling (self-scheduling to prevent overlap)
                schedulePoll();

            } catch (e) {
                console.error('Start pass error:', e);
            }
        }

        // Update tag details display for a camera
        function updateTagDetails(idx) {
            const tagsEl = document.getElementById(`tags-${idx}`);
            if (!tagsEl) return;

            const details = cameraTagDetails[idx] || [];
            if (details.length === 0) {
                tagsEl.innerHTML = '<div class="no-tags">No tags detected</div>';
                return;
            }

            // Sort by family then id
            const sorted = [...details].sort((a, b) => {
                if (a.family !== b.family) return a.family.localeCompare(b.family);
                return a.id - b.id;
            });

            const html = sorted.map(t => `
                <div class="tag-item ${t.family}">
                    <span><span class="tag-id">#${t.id}</span> <span class="tag-family">${t.family}</span></span>
                    <span class="tag-margin">${t.margin}</span>
                </div>
            `).join('');

            tagsEl.innerHTML = html;
        }

        // Update pass results display for a camera
        function updatePassDisplay(idx) {
            const passesEl = document.getElementById(`passes-${idx}`);
            const results = cameraPassResults[idx];
            const spans = [];

            for (let i = 0; i < NUM_PASSES; i++) {
                if (i < results.length) {
                    const tags = results[i];
                    const isCurrent = (i === results.length - 1);

                    if (tags === 'X') {
                        spans.push('<span class="mismatch">X</span>');
                        continue;
                    }

                    const prevNumeric = results.slice(0, i).filter(v => v !== 'X');
                    const hasMismatch = prevNumeric.length > 0 && prevNumeric.some(prev => prev !== tags);

                    let cls = isCurrent ? 'current' : '';
                    if (hasMismatch) cls = 'mismatch';

                    spans.push(`<span class="${cls}">${tags}</span>`);
                } else {
                    spans.push('<span>-</span>');
                }
            }
            passesEl.innerHTML = spans.join('');
        }

        function updateStats() {
            document.getElementById('statFrames').textContent = frameCount;

            if (frameCount > 0) {
                document.getElementById('statAvgQueue').textContent = totalQueueMs > 0 ? Math.round(totalQueueMs / frameCount) : '-';
                document.getElementById('statAvgCapture').textContent = totalCaptureMs > 0 ? Math.round(totalCaptureMs / frameCount) : '-';
                document.getElementById('statAvgOverhead').textContent = totalOverheadMs > 0 ? Math.round(totalOverheadMs / frameCount) : '-';
                document.getElementById('statAvgDetect').textContent = Math.round(totalDetectMs / frameCount);
            }

            // Calculate total tags from cameraPassResults
            let tagsSum = 0;
            for (const idx in cameraPassResults) {
                for (const val of cameraPassResults[idx]) {
                    if (val !== 'X' && typeof val === 'number') {
                        tagsSum += val;
                    }
                }
            }
            document.getElementById('statTags').textContent = tagsSum;

            if (startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                const fps = frameCount / elapsed;
                document.getElementById('statFps').textContent = fps.toFixed(1);
            }
        }

        // Start test
        async function startTest() {
            running = true;
            currentPassId = null;
            currentPassNum = 0;
            frameCount = 0;
            totalQueueMs = 0;
            totalCaptureMs = 0;
            totalOverheadMs = 0;
            totalDetectMs = 0;
            totalTags = 0;
            startTime = Date.now();
            loadedImages = {};

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('passIndicator').textContent = `Pass: 0 / ${NUM_PASSES}`;

            // Disable NVR controls during test
            nvrList.forEach(nvr => {
                const cb = document.getElementById(`nvr-enable-${nvr}`);
                if (cb) cb.disabled = true;
                const snapCb = document.getElementById(`nvr-snap-${nvr}`);
                if (snapCb) snapCb.disabled = true;
            });

            // Rebuild grid with current selection
            buildGrid();

            // Reset progress bar
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.classList.remove('complete');
            document.querySelector('.progress-container').style.display = 'block';

            // Reset pass results for all visible cameras
            const enabledCameras = getEnabledCameras();
            enabledCameras.forEach((_, idx) => {
                cameraPassResults[idx] = [];
                const passesEl = document.getElementById(`passes-${idx}`);
                if (passesEl) {
                    passesEl.innerHTML = Array(NUM_PASSES).fill('<span>-</span>').join('');
                }
            });

            // Start first pass
            await startNextPass();
        }

        // Stop test
        function stopTest() {
            running = false;
            document.getElementById('stopBtn').disabled = true;

            if (pollInterval) {
                clearTimeout(pollInterval);
                pollInterval = null;
            }

            // Re-enable NVR controls
            nvrList.forEach(nvr => {
                const cb = document.getElementById(`nvr-enable-${nvr}`);
                if (cb) cb.disabled = false;
                const snapCb = document.getElementById(`nvr-snap-${nvr}`);
                if (snapCb) snapCb.disabled = !nvrConfig[nvr].enabled;
            });

            updateStartButton();
        }

        // Reset stats
        async function resetStats() {
            frameCount = 0;
            totalQueueMs = 0;
            totalCaptureMs = 0;
            totalOverheadMs = 0;
            totalDetectMs = 0;
            totalTags = 0;
            currentPassNum = 0;
            startTime = null;
            loadedImages = {};
            cameraTagDetails = {};

            document.getElementById('statFrames').textContent = '0';
            document.getElementById('statAvgQueue').textContent = '-';
            document.getElementById('statAvgCapture').textContent = '-';
            document.getElementById('statAvgOverhead').textContent = '-';
            document.getElementById('statAvgDetect').textContent = '-';
            document.getElementById('statTags').textContent = '0';
            document.getElementById('statFps').textContent = '-';
            document.getElementById('passIndicator').textContent = `Pass: 0 / ${NUM_PASSES}`;

            // Reset progress bar
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.classList.remove('complete');

            // Reset camera tiles
            cameras.forEach((_, idx) => {
                cameraPassResults[idx] = [];
                cameraTagDetails[idx] = [];
                const passesEl = document.getElementById(`passes-${idx}`);
                if (passesEl) {
                    passesEl.innerHTML = Array(NUM_PASSES).fill('<span>-</span>').join('');
                }
                const tagsEl = document.getElementById(`tags-${idx}`);
                if (tagsEl) tagsEl.innerHTML = '';
                const timing = document.getElementById(`timing-${idx}`);
                if (timing) timing.textContent = '--';
                const img = document.getElementById(`img-${idx}`);
                if (img) img.src = '';
            });
        }

        // Show offline message when camera service is down
        function showOfflineMessage() {
            document.getElementById('cameraGrid').innerHTML = '';
            document.getElementById('nvrControls').innerHTML = '';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('passIndicator').textContent = '';
            document.querySelector('.progress-container').style.display = 'none';
            document.querySelector('.stats-bar').style.display = 'none';

            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 80px 20px;">
                    <div style="font-size: 48px; margin-bottom: 20px; color: #ff4757;">&#x26A0;</div>
                    <div style="font-size: 24px; color: #ff4757; margin-bottom: 12px;">Camera Service Offline</div>
                    <div style="color: #888; font-size: 14px;">
                        Cannot reach camera-service at 127.0.0.1:8001
                    </div>
                    <button onclick="loadCameras()" style="margin-top: 24px; padding: 10px 24px; font-size: 14px; border: 1px solid #555; border-radius: 6px; background: #2d2d44; color: #eee; cursor: pointer;">Retry</button>
                </div>
            `;
        }

        // Load camera list from API
        async function loadCameras() {
            try {
                const response = await fetch(`${DETECTION_SERVICE}/cameras`);
                if (response.ok) {
                    const data = await response.json();
                    if (!data.camera_service_online) {
                        showOfflineMessage();
                        return;
                    }
                    if (data.cameras && data.cameras.length > 0) {
                        cameras = data.cameras.map(c => ({
                            nvr: c.nvr,
                            channel: c.channel,
                            name: c.name || `${c.nvr}/ch${c.channel}`,
                            snapshot: c.snapshot || false
                        }));
                    }
                } else {
                    showOfflineMessage();
                    return;
                }
            } catch (e) {
                showOfflineMessage();
                return;
            }
            // Restore UI elements in case we're returning from offline state
            document.querySelector('.stats-bar').style.display = '';
            document.querySelector('.progress-container').style.display = '';
            buildNvrControls();
            buildGrid();
        }

        // Initialize
        loadCameras();
    </script>
</body>
</html>
