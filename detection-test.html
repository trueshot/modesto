<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprilTag Detection Benchmark</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button.start {
            background: #00d46a;
            color: #000;
        }
        .controls button.stop {
            background: #ff4757;
            color: #fff;
        }
        .controls button.reset {
            background: #ffa502;
            color: #000;
        }
        .controls button:hover {
            transform: scale(1.05);
        }
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .source-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2d2d44;
            padding: 8px 16px;
            border-radius: 6px;
        }
        .source-toggle label {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .source-toggle input[type="radio"] {
            display: none;
        }
        .source-toggle input[type="radio"]:checked + label {
            background: #00d4ff;
            color: #000;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            padding: 15px;
            background: #2d2d44;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat .value {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 15px;
        }
        .camera-tile {
            background: #2d2d44;
            border-radius: 8px;
            overflow: hidden;
        }
        .camera-tile .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #3d3d5c;
        }
        .camera-tile .name {
            font-weight: bold;
        }
        .camera-tile .name small {
            font-weight: normal;
            font-size: 10px;
            color: #888;
            display: block;
        }
        .camera-tile .snapshot-badge {
            font-size: 9px;
            background: #00d46a;
            color: #000;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 5px;
        }
        @keyframes pulse-success {
            0% { box-shadow: 0 0 0 0 rgba(0, 212, 106, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(0, 212, 106, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 212, 106, 0); }
        }
        @keyframes pulse-fail {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
        @keyframes flash-border {
            0% { border-color: #00d4ff; }
            100% { border-color: transparent; }
        }
        .camera-tile {
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .camera-tile.updated {
            animation: pulse-success 0.4s ease-out, flash-border 0.4s ease-out;
        }
        .camera-tile.failed {
            animation: pulse-fail 0.5s ease-out;
            border-color: #ff4757;
        }
        .camera-tile .pass-results {
            display: flex;
            gap: 4px;
            padding: 4px 10px;
            background: #1a1a2e;
            font-size: 11px;
            font-family: monospace;
        }
        .camera-tile .pass-results span {
            padding: 2px 6px;
            border-radius: 3px;
            background: #2d2d44;
            color: #888;
        }
        .camera-tile .pass-results span.current {
            background: #00d4ff;
            color: #000;
        }
        .camera-tile .pass-results span.mismatch {
            background: #ff4757;
            color: #fff;
        }
        .camera-tile .timing {
            font-size: 12px;
            color: #00d4ff;
        }
        .camera-tile .resolution {
            font-size: 12px;
            color: #aaa;
        }
        .camera-tile img {
            width: 100%;
            display: block;
            min-height: 200px;
            background: #1a1a2e;
        }
        .camera-tile .error {
            padding: 40px;
            text-align: center;
            color: #ff4757;
        }
        .pass-indicator {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 10px;
        }
        .progress-container {
            width: 300px;
            height: 8px;
            background: #2d2d44;
            border-radius: 4px;
            margin: 8px auto;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00d46a);
            border-radius: 4px;
            width: 0%;
            transition: width 0.15s ease-out;
        }
        .progress-bar.complete {
            background: #00d46a;
        }
    </style>
</head>
<body>
    <h1>AprilTag Detection Benchmark</h1>

    <div class="controls">
        <button class="start" id="startBtn" onclick="startTest()">Start Test</button>
        <button class="stop" id="stopBtn" onclick="stopTest()" disabled>Stop</button>
        <button class="reset" onclick="resetStats()">Reset Stats</button>

        <div class="source-toggle">
            <span>Transport:</span>
            <input type="radio" name="transport" id="tHttp" value="http" checked>
            <label for="tHttp">HTTP</label>
            <input type="radio" name="transport" id="tZmq" value="zmq">
            <label for="tZmq">ZMQ</label>
        </div>
        <div class="source-toggle">
            <input type="checkbox" id="useSnapshot">
            <label for="useSnapshot" style="cursor:pointer;">Use snapshots (nvr2 only)</label>
        </div>
    </div>

    <div class="pass-indicator" id="passIndicator">Pass: 0 / 3</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <div class="value" id="statFrames">0</div>
            <div class="label">Total Frames</div>
        </div>
        <div class="stat">
            <div class="value" id="statAvgFetch">-</div>
            <div class="label">Avg Fetch (ms)</div>
        </div>
        <div class="stat">
            <div class="value" id="statAvgDetect">-</div>
            <div class="label">Avg Detect (ms)</div>
        </div>
        <div class="stat">
            <div class="value" id="statTags">0</div>
            <div class="label">Total Tags</div>
        </div>
        <div class="stat">
            <div class="value" id="statFps">-</div>
            <div class="label">FPS (all cams)</div>
        </div>
    </div>

    <div class="camera-grid" id="cameraGrid"></div>

    <script>
        // Use relative URLs when served from /test endpoint, absolute otherwise
        const DETECTION_SERVICE = window.location.port === '8002' ? '' : 'http://localhost:8002';
        const NUM_PASSES = 3;

        // Camera list - will be populated from API or use defaults
        let cameras = [
            { nvr: 'nvr1', channel: 7, name: 'biscuit (nvr1/ch7)' },
            { nvr: 'nvr2', channel: 2, name: 'nvr2/ch2' },
        ];

        let running = false;
        let pass = 0;
        let frameCount = 0;
        let totalFetchMs = 0;
        let totalDetectMs = 0;
        let totalTags = 0;
        let startTime = null;
        let pendingRequests = 0;
        let cameraPassResults = {};  // Track tags per camera per pass
        let cameraFailed = {};       // Track which cameras have failed

        // Build camera tiles
        function buildGrid() {
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = '';

            cameras.forEach((cam, idx) => {
                const tile = document.createElement('div');
                tile.className = 'camera-tile';
                tile.id = `tile-${idx}`;
                const snapBadge = cam.snapshot ? '<span class="snapshot-badge">SNAP</span>' : '';
                const passSlots = Array(NUM_PASSES).fill('<span>-</span>').join('');
                tile.innerHTML = `
                    <div class="header">
                        <span class="name">${cam.name}${snapBadge}<small>${cam.nvr} ch${cam.channel}</small></span>
                        <span class="resolution" id="res-${idx}">--</span>
                        <span class="timing" id="timing-${idx}">--</span>
                    </div>
                    <img id="img-${idx}" src="" alt="Camera ${idx}">
                    <div class="pass-results" id="passes-${idx}">${passSlots}</div>
                `;
                // Store snapshot support for this camera
                tile.dataset.snapshot = cam.snapshot ? 'true' : 'false';
                // Initialize pass results tracking
                cameraPassResults[idx] = [];
                grid.appendChild(tile);
            });
        }

        // Get query params based on transport + snapshot checkbox
        function getSourceParams(supportsSnapshot) {
            const transport = document.querySelector('input[name="transport"]:checked').value;
            const useSnapshot = document.getElementById('useSnapshot').checked && (supportsSnapshot === true);
            return `transport=${transport}&snapshot=${useSnapshot ? 'true' : 'false'}`;
        }

        // Update a single camera tile
        async function updateCamera(idx) {
            if (!running) return;

            // Skip cameras that have already failed
            if (cameraFailed[idx]) {
                if (running) {
                    setTimeout(() => updateCamera(idx), 500);
                }
                return;
            }

            const cam = cameras[idx];
            const params = getSourceParams(cam.snapshot);
            const url = `${DETECTION_SERVICE}/detect/${cam.nvr}/${cam.channel}?${params}&_t=${Date.now()}`;

            const img = document.getElementById(`img-${idx}`);
            const timing = document.getElementById(`timing-${idx}`);

            pendingRequests++;
            const fetchStart = performance.now();

            const resEl = document.getElementById(`res-${idx}`);

            const tile = document.getElementById(`tile-${idx}`);

            try {
                const response = await fetch(url);
                if (response.ok) {
                    const blob = await response.blob();
                    img.src = URL.createObjectURL(blob);

                    // Get stats from headers
                    const resolution = response.headers.get('X-Resolution') || '--';
                    const fetchMs = parseInt(response.headers.get('X-Fetch-Ms') || '0');
                    const detectMs = parseInt(response.headers.get('X-Detect-Ms') || '0');
                    const tags = parseInt(response.headers.get('X-Tags') || '0');

                    resEl.textContent = resolution;
                    timing.textContent = `${fetchMs}+${detectMs}ms | ${tags} tags`;

                    totalFetchMs += fetchMs;
                    totalDetectMs += detectMs;
                    totalTags += tags;
                    frameCount++;

                    // Track pass results for this camera
                    const camPassNum = cameraPassResults[idx].length;
                    if (camPassNum < NUM_PASSES) {
                        cameraPassResults[idx].push(tags);
                        updatePassDisplay(idx);
                    }

                    // Trigger success animation
                    tile.classList.remove('updated', 'failed');
                    void tile.offsetWidth; // Force reflow to restart animation
                    tile.classList.add('updated');

                    updateStats();
                } else {
                    timing.textContent = 'error';
                    tile.classList.remove('updated', 'failed');
                    void tile.offsetWidth;
                    tile.classList.add('failed');
                    // Mark as failed and record which pass
                    cameraFailed[idx] = true;
                    cameraPassResults[idx].push('X');
                    updatePassDisplay(idx);
                }
            } catch (e) {
                timing.textContent = 'failed';
                tile.classList.remove('updated', 'failed');
                void tile.offsetWidth;
                tile.classList.add('failed');
                // Mark as failed and record which pass
                cameraFailed[idx] = true;
                cameraPassResults[idx].push('X');
                updatePassDisplay(idx);
                console.error(`Camera ${idx} error:`, e);
            }

            pendingRequests--;

            // Schedule next update for this camera
            if (running) {
                setTimeout(() => updateCamera(idx), 100);  // Small delay between requests
            }

            // Check if pass complete
            checkPassComplete();
        }

        // Check if a pass is complete and update progress bar
        function checkPassComplete() {
            const framesPerPass = cameras.length;
            const completedPasses = Math.floor(frameCount / framesPerPass);
            const framesInCurrentPass = frameCount % framesPerPass;
            const progressPercent = framesPerPass > 0 ? (framesInCurrentPass / framesPerPass) * 100 : 0;

            // Update progress bar
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${progressPercent}%`;

            if (completedPasses > pass && completedPasses <= NUM_PASSES) {
                pass = completedPasses;
                document.getElementById('passIndicator').textContent = `Pass: ${pass} / ${NUM_PASSES}`;

                // Reset progress bar for next pass (or hide if complete)
                if (pass >= NUM_PASSES) {
                    stopTest();
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                    document.getElementById('passIndicator').textContent += ` - COMPLETE (${elapsed}s)`;
                    document.querySelector('.progress-container').style.display = 'none';
                } else {
                    progressBar.style.width = '0%';
                }
            }
        }

        // Update stats display
        // Update pass results display for a camera
        function updatePassDisplay(idx) {
            const passesEl = document.getElementById(`passes-${idx}`);
            const results = cameraPassResults[idx];
            const spans = [];

            for (let i = 0; i < NUM_PASSES; i++) {
                if (i < results.length) {
                    const tags = results[i];
                    const isCurrent = (i === results.length - 1);

                    // Handle failure marker
                    if (tags === 'X') {
                        spans.push('<span class="mismatch">X</span>');
                        continue;
                    }

                    // Check for mismatch with previous passes (ignore X failures)
                    const prevNumeric = results.slice(0, i).filter(v => v !== 'X');
                    const hasMismatch = prevNumeric.length > 0 &&
                        prevNumeric.some(prev => prev !== tags);

                    let cls = isCurrent ? 'current' : '';
                    if (hasMismatch) cls = 'mismatch';

                    spans.push(`<span class="${cls}">${tags}</span>`);
                } else {
                    spans.push('<span>-</span>');
                }
            }
            passesEl.innerHTML = spans.join('');
        }

        function updateStats() {
            document.getElementById('statFrames').textContent = frameCount;

            if (frameCount > 0) {
                document.getElementById('statAvgFetch').textContent = Math.round(totalFetchMs / frameCount);
                document.getElementById('statAvgDetect').textContent = Math.round(totalDetectMs / frameCount);
            }

            // Calculate total tags from cameraPassResults (source of truth)
            let tagsSum = 0;
            for (const idx in cameraPassResults) {
                for (const val of cameraPassResults[idx]) {
                    if (val !== 'X' && typeof val === 'number') {
                        tagsSum += val;
                    }
                }
            }
            document.getElementById('statTags').textContent = tagsSum;

            if (startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                const fps = frameCount / elapsed;
                document.getElementById('statFps').textContent = fps.toFixed(1);
            }
        }

        // Fetch server stats (for accurate timing only, tags tracked client-side)
        async function fetchServerStats() {
            try {
                const response = await fetch(`${DETECTION_SERVICE}/stats`);
                if (response.ok) {
                    const data = await response.json();
                    // Update with server-side accurate timing stats
                    let totalFrames = 0;
                    let totalFetch = 0;
                    let totalDetect = 0;

                    for (const [key, s] of Object.entries(data)) {
                        totalFrames += s.count;
                        totalFetch += s.avg_fetch_ms * s.count;
                        totalDetect += s.avg_detect_ms * s.count;
                    }

                    if (totalFrames > 0) {
                        document.getElementById('statAvgFetch').textContent = Math.round(totalFetch / totalFrames);
                        document.getElementById('statAvgDetect').textContent = Math.round(totalDetect / totalFrames);
                    }
                }
            } catch (e) {
                console.error('Stats fetch error:', e);
            }
        }

        // Start test
        async function startTest() {
            running = true;
            pass = 0;
            frameCount = 0;
            totalFetchMs = 0;
            totalDetectMs = 0;
            totalTags = 0;
            startTime = Date.now();

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('passIndicator').textContent = `Pass: 0 / ${NUM_PASSES}`;

            // Reset and show progress bar
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.classList.remove('complete');
            document.querySelector('.progress-container').style.display = 'block';

            // Reset pass results and failed status for all cameras
            cameras.forEach((_, idx) => {
                cameraPassResults[idx] = [];
                cameraFailed[idx] = false;
                const passesEl = document.getElementById(`passes-${idx}`);
                if (passesEl) {
                    passesEl.innerHTML = Array(NUM_PASSES).fill('<span>-</span>').join('');
                }
            });

            // Reset server stats before starting
            try {
                await fetch(`${DETECTION_SERVICE}/stats/reset`, { method: 'POST' });
            } catch (e) {
                console.error('Failed to reset server stats:', e);
            }

            // Start all cameras
            cameras.forEach((_, idx) => updateCamera(idx));

            // Poll server stats periodically
            statsInterval = setInterval(fetchServerStats, 2000);
        }

        // Stop test
        function stopTest() {
            running = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            if (statsInterval) {
                clearInterval(statsInterval);
            }

            // Final stats fetch
            fetchServerStats();
        }

        // Reset stats
        async function resetStats() {
            frameCount = 0;
            totalFetchMs = 0;
            totalDetectMs = 0;
            totalTags = 0;
            pass = 0;
            startTime = null;

            document.getElementById('statFrames').textContent = '0';
            document.getElementById('statAvgFetch').textContent = '-';
            document.getElementById('statAvgDetect').textContent = '-';
            document.getElementById('statTags').textContent = '0';
            document.getElementById('statFps').textContent = '-';
            document.getElementById('passIndicator').textContent = `Pass: 0 / ${NUM_PASSES}`;

            // Reset progress bar
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            progressBar.classList.remove('complete');

            // Reset server stats
            try {
                await fetch(`${DETECTION_SERVICE}/stats/reset`, { method: 'POST' });
            } catch (e) {
                console.error('Reset error:', e);
            }
        }

        // Try to fetch camera list from API
        async function loadCameras() {
            try {
                const response = await fetch(`${DETECTION_SERVICE}/cameras`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.cameras && data.cameras.length > 0) {
                        cameras = data.cameras.map(c => ({
                            nvr: c.nvr,
                            channel: c.channel,
                            name: c.name || `${c.nvr}/ch${c.channel}`,
                            snapshot: c.snapshot || false
                        }));
                    }
                }
            } catch (e) {
                console.log('Using default camera list');
            }
            buildGrid();
        }

        let statsInterval = null;

        // Initialize
        loadCameras();
    </script>
</body>
</html>
