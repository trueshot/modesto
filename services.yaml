services:
  modelt-server:
    name: ModelT Server
    command: node server.js
    cwd: server
    port: 5173
    autostart: false

  nvr-service:
    name: NVR Probe
    command: python server.py
    cwd: nvr-service
    port: 7999
    autostart: false

  asksam:
    name: AskSAM
    command: docker-compose up
    cwd: ../asksam
    port: 8000
    autostart: false

  camera-service:
    name: Cameras
    command: python api/server.py
    cwd: camera-service
    port: 8001
    autostart: false

  detection:
    name: AprilTag Detection
    command: python detection-service.py
    port: 8002
    autostart: false

  fasttag:
    name: FastTag
    command: python server.py
    cwd: fasttag
    port: 8003
    autostart: false

  # Marshal Gateway — hosts every specialist's MEP (Marshal Explainer Page).
  # Reboot/session-independent supervision is the Scheduled Task "MarshalGateway"
  # (trigger=AtLogon), which runs marshalltown's canonical supervisor
  # c:/clients/marshalltown/gateway/start.bat — a self-looping respawn on
  # /restart's process.exit(0). Single supervisor script, owned by marshalltown.
  # svc.js will ADOPT the already-listening instance rather than spawn a duplicate.
  # Added by modestomulti gen-6.
  marshal-gateway:
    name: Marshal Gateway
    command: node server.js
    cwd: ../marshalltown/gateway
    port: 3500
    autostart: false
