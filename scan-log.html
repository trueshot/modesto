<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprilTag Scan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; }

        .controls {
            display: flex; justify-content: center; gap: 16px;
            margin-bottom: 20px; flex-wrap: wrap; align-items: flex-start;
        }
        .controls label { color: #aaa; font-size: 14px; }
        .controls input, .controls textarea {
            background: #2d2d44; border: 1px solid #555; border-radius: 6px;
            color: #eee; padding: 8px 12px; font-family: monospace; font-size: 13px;
        }
        .controls textarea { width: 400px; height: 80px; resize: vertical; }
        .controls input[type="number"] { width: 70px; }
        button {
            padding: 10px 24px; font-size: 14px; border: none; border-radius: 6px;
            cursor: pointer; transition: all 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.4; cursor: default; transform: none; }
        .btn-start { background: #00d46a; color: #000; }
        .btn-stop { background: #ff4757; color: #fff; }
        .btn-small { padding: 4px 12px; font-size: 12px; background: #444; color: #ccc; }

        /* Camera selector */
        .camera-selector {
            background: #2d2d44; border: 1px solid #555; border-radius: 8px;
            padding: 12px; max-width: 500px;
        }
        .camera-selector .nvr-group { margin-bottom: 8px; }
        .camera-selector .nvr-label {
            font-size: 13px; font-weight: bold; color: #00d4ff;
            margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
        }
        .camera-selector .nvr-label button {
            padding: 2px 8px; font-size: 11px; background: #444; color: #aaa;
        }
        .camera-selector .channels {
            display: flex; flex-wrap: wrap; gap: 4px; margin-left: 4px;
        }
        .camera-selector .ch-btn {
            padding: 4px 10px; font-size: 12px; font-family: monospace;
            background: #1a1a2e; border: 1px solid #555; border-radius: 4px;
            color: #888; cursor: pointer; transition: all 0.15s;
        }
        .camera-selector .ch-btn.selected {
            background: #00d46a; color: #000; border-color: #00d46a;
        }
        .camera-selector .ch-btn:hover { border-color: #00d4ff; }

        .status-bar {
            display: flex; justify-content: center; gap: 32px;
            margin-bottom: 16px; font-size: 14px; color: #aaa;
        }
        .status-bar .val { color: #00d4ff; font-weight: bold; }
        .status-bar .running { color: #00d46a; }
        .status-bar .done { color: #ffa502; }

        .summary {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            margin-bottom: 16px;
        }
        .cam-chip {
            background: #2d2d44; border: 1px solid #444; border-radius: 8px;
            padding: 6px 14px; font-size: 13px; font-family: monospace;
        }
        .cam-chip .label { color: #aaa; }
        .cam-chip .frames { color: #00d4ff; }
        .cam-chip .tags { color: #00d46a; margin-left: 8px; }

        .log-container {
            background: #0d0d1a; border: 1px solid #333; border-radius: 8px;
            max-height: 60vh; overflow-y: auto; padding: 0; position: relative;
        }
        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 16px; background: #2d2d44; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 1;
        }
        .log-header span { font-size: 13px; color: #aaa; }

        .log-lines { padding: 8px 16px; font-family: monospace; font-size: 13px; line-height: 1.6; }
        .log-line { white-space: nowrap; }
        .log-line .ts { color: #666; }
        .log-line .cam { color: #00d4ff; }
        .log-line .tag { color: #00d46a; font-weight: bold; }
        .log-line .family { color: #ffa502; }
        .log-line .size { color: #a29bfe; }
        .log-line .orient { color: #fd79a8; }
        .log-line .margin { color: #888; }

        .offline-msg {
            text-align: center; padding: 80px 20px;
        }
        .offline-msg .icon { font-size: 48px; margin-bottom: 16px; color: #ff4757; }
        .offline-msg .title { font-size: 22px; margin-bottom: 8px; color: #ff4757; }
        .offline-msg .detail { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <h1>AprilTag Scan</h1>

    <div class="controls" id="controls">
        <div>
            <label>Select cameras:</label>
            <div class="camera-selector" id="cameraSelector">
                <div style="color: #666; font-size: 13px;">Loading cameras...</div>
            </div>
        </div>
        <div>
            <label>JSON payload (editable):</label><br>
            <textarea id="camerasInput">[]</textarea>
            <br>
            <label>Timeout (s):</label>
            <input type="number" id="timeoutInput" value="30" min="5" max="300">
        </div>
        <div style="align-self: flex-end;">
            <button class="btn-start" id="startBtn" onclick="startScan()" disabled>Start Scan</button>
            <button class="btn-stop" id="stopBtn" onclick="stopScan()" disabled>Stop</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar" style="display: none;">
        <span>Status: <span class="val" id="statusState">-</span></span>
        <span>Elapsed: <span class="val" id="statusElapsed">0s</span></span>
        <span>Observations: <span class="val" id="statusObs">0</span></span>
        <span>Unique Tags: <span class="val" id="statusUnique">0</span></span>
    </div>

    <div class="summary" id="summary"></div>

    <div class="log-container" id="logContainer" style="display: none;">
        <div class="log-header">
            <span id="logCount">0 lines</span>
            <div>
                <button class="btn-small" id="autoscrollBtn" onclick="toggleAutoscroll()">Auto-scroll: ON</button>
                <button class="btn-small" onclick="clearLog()">Clear</button>
            </div>
        </div>
        <div class="log-lines" id="logLines"></div>
    </div>

    <div class="log-container" id="rawContainer" style="display: none; margin-top: 16px;">
        <div class="log-header">
            <span>Raw JSONL</span>
            <div>
                <button class="btn-small" id="rawAutoscrollBtn" onclick="toggleRawAutoscroll()">Auto-scroll: ON</button>
                <button class="btn-small" onclick="clearRaw()">Clear</button>
            </div>
        </div>
        <div class="log-lines" id="rawLines" style="font-size: 11px; line-height: 1.4; color: #777; word-break: break-all; white-space: pre-wrap;"></div>
    </div>

<script>
const DETECTION_SERVICE = window.location.port === '8002' ? '' : 'http://localhost:8002';
let allCameras = [];  // from /cameras endpoint
let selectedCameras = new Set();  // "nvr/channel" keys
let scanId = null;
let pollInterval = null;
let logOffset = 0;
let autoscroll = true;
let rawAutoscroll = true;
let totalLines = 0;

// ── Camera selector ──

async function loadCameras() {
    const selector = document.getElementById('cameraSelector');
    try {
        const resp = await fetch(`${DETECTION_SERVICE}/cameras`);
        const data = await resp.json();

        if (!data.camera_service_online) {
            selector.innerHTML = `<div class="offline-msg">
                <div class="icon">&#x26A0;</div>
                <div class="title">Camera Service Offline</div>
                <div class="detail">Cannot reach camera-service at 127.0.0.1:8001</div>
                <button class="btn-small" onclick="loadCameras()" style="margin-top:12px;">Retry</button>
            </div>`;
            return;
        }

        allCameras = data.cameras || [];
        if (allCameras.length === 0) {
            selector.innerHTML = '<div style="color:#888;">No cameras found</div>';
            return;
        }

        buildSelector();
        document.getElementById('startBtn').disabled = false;
    } catch (e) {
        selector.innerHTML = `<div style="color:#ff4757;">Detection service unreachable</div>`;
    }
}

function buildSelector() {
    const selector = document.getElementById('cameraSelector');
    selector.innerHTML = '';

    // Group by NVR
    const byNvr = {};
    for (const cam of allCameras) {
        if (!byNvr[cam.nvr]) byNvr[cam.nvr] = [];
        byNvr[cam.nvr].push(cam);
    }

    for (const [nvrId, cams] of Object.entries(byNvr).sort()) {
        const group = document.createElement('div');
        group.className = 'nvr-group';

        const label = document.createElement('div');
        label.className = 'nvr-label';
        label.innerHTML = `<span>${nvrId}</span>`;

        const allBtn = document.createElement('button');
        allBtn.textContent = 'all';
        allBtn.onclick = () => { toggleNvr(nvrId, true); };
        label.appendChild(allBtn);

        const noneBtn = document.createElement('button');
        noneBtn.textContent = 'none';
        noneBtn.onclick = () => { toggleNvr(nvrId, false); };
        label.appendChild(noneBtn);

        group.appendChild(label);

        const channels = document.createElement('div');
        channels.className = 'channels';

        for (const cam of cams.sort((a, b) => a.channel - b.channel)) {
            const btn = document.createElement('button');
            btn.className = 'ch-btn';
            btn.dataset.key = `${cam.nvr}/${cam.channel}`;
            // Check if resolution is below 3K
            let resW = 0;
            if (cam.resolution && cam.resolution !== 'Unknown') {
                resW = parseInt(cam.resolution.split('x')[0]) || 0;
            }
            const lowRes = resW > 0 && resW < 3072;
            const name = cam.name && !cam.name.startsWith('nvr') && !cam.name.startsWith('ch') ? cam.name : '';
            btn.textContent = `ch${cam.channel}` + (lowRes ? ' !' : '');
            btn.title = (name ? name + ' ' : '') + (cam.resolution || '') + (lowRes ? ' — low res, tags unlikely' : '');
            if (lowRes) btn.style.borderColor = '#ff475766';
            btn.onclick = () => toggleCamera(btn);
            channels.appendChild(btn);
        }

        group.appendChild(channels);
        selector.appendChild(group);
    }
}

function toggleCamera(btn) {
    const key = btn.dataset.key;
    if (selectedCameras.has(key)) {
        selectedCameras.delete(key);
        btn.classList.remove('selected');
    } else {
        selectedCameras.add(key);
        btn.classList.add('selected');
    }
    syncJson();
}

function toggleNvr(nvrId, selectAll) {
    const buttons = document.querySelectorAll(`.ch-btn[data-key^="${nvrId}/"]`);
    buttons.forEach(btn => {
        const key = btn.dataset.key;
        if (selectAll) {
            selectedCameras.add(key);
            btn.classList.add('selected');
        } else {
            selectedCameras.delete(key);
            btn.classList.remove('selected');
        }
    });
    syncJson();
}

function syncJson() {
    const cameras = Array.from(selectedCameras).map(key => {
        const [nvr, ch] = key.split('/');
        return {nvr, channel: parseInt(ch)};
    }).sort((a, b) => a.nvr.localeCompare(b.nvr) || a.channel - b.channel);
    document.getElementById('camerasInput').value = JSON.stringify(cameras, null, 2);
}

// ── Scan lifecycle ──

async function startScan() {
    let cameras;
    try {
        cameras = JSON.parse(document.getElementById('camerasInput').value);
    } catch (e) {
        alert('Invalid JSON in cameras payload');
        return;
    }
    if (!cameras.length) {
        alert('Select at least one camera');
        return;
    }
    const timeout = parseInt(document.getElementById('timeoutInput').value) || 30;

    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('statusBar').style.display = 'flex';
    document.getElementById('logContainer').style.display = 'block';
    document.getElementById('rawContainer').style.display = 'block';
    document.getElementById('logLines').innerHTML = '';
    document.getElementById('rawLines').innerHTML = '';
    document.getElementById('summary').innerHTML = '';
    logOffset = 0;
    totalLines = 0;

    try {
        const resp = await fetch(`${DETECTION_SERVICE}/scan/start`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cameras, timeout})
        });
        const data = await resp.json();

        if (data.error) {
            appendLogLine(`Error: ${data.error}`, '#ff4757');
            resetControls();
            return;
        }

        scanId = data.scanId;
        appendLogLine(`Scan ${scanId} started \u2014 ${cameras.length} cameras, ${timeout}s timeout`);
        pollInterval = setInterval(pollScan, 500);
    } catch (e) {
        appendLogLine('Detection service unreachable', '#ff4757');
        resetControls();
    }
}

function stopScan() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = null;
    resetControls();
    const el = document.getElementById('statusState');
    el.textContent = 'stopped';
    el.className = 'val done';
}

function resetControls() {
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
}

// ── Polling ──

async function pollScan() {
    if (!scanId) return;

    try {
        const [statusResp, logResp] = await Promise.all([
            fetch(`${DETECTION_SERVICE}/scan/${scanId}/status`),
            fetch(`${DETECTION_SERVICE}/scan/${scanId}/log?after=${logOffset}`)
        ]);

        const status = await statusResp.json();
        const log = await logResp.json();

        // Status bar
        const stateEl = document.getElementById('statusState');
        if (status.running) {
            stateEl.textContent = 'scanning';
            stateEl.className = 'val running';
        } else {
            stateEl.textContent = 'done';
            stateEl.className = 'val done';
        }
        document.getElementById('statusElapsed').textContent = `${status.elapsed_s}s`;
        document.getElementById('statusObs').textContent = status.total_observations;
        document.getElementById('statusUnique').textContent = status.unique_tags;

        // Camera chips
        if (status.cameras) {
            const summary = document.getElementById('summary');
            summary.innerHTML = '';
            for (const [key, cam] of Object.entries(status.cameras).sort((a, b) => {
                const [nvrA, chA] = a[0].split('/');
                const [nvrB, chB] = b[0].split('/');
                return nvrA.localeCompare(nvrB) || (parseInt(chA) || 0) - (parseInt(chB) || 0);
            })) {
                const chip = document.createElement('div');
                chip.className = 'cam-chip';
                chip.innerHTML = `<span class="label">${key}</span> ` +
                    `<span class="frames">${cam.frames}f</span>` +
                    `<span class="tags">${cam.unique_tags} tags</span>`;
                summary.appendChild(chip);
            }
        }

        // Log lines
        if (log.lines && log.lines.length > 0) {
            const container = document.getElementById('logLines');
            for (const entry of log.lines) {
                const div = document.createElement('div');
                div.className = 'log-line';
                // ts might be Unix epoch or relative seconds — detect and format accordingly
                let ts;
                if (entry.ts > 1e9) {
                    const d = new Date(entry.ts * 1000);
                    const hh = String(d.getHours()).padStart(2, '0');
                    const mm = String(d.getMinutes()).padStart(2, '0');
                    const ss = String(d.getSeconds()).padStart(2, '0');
                    const ms = String(Math.floor(d.getMilliseconds() / 100));
                    ts = `${hh}:${mm}:${ss}.${ms}`;
                } else {
                    ts = Number(entry.ts).toFixed(1) + 's';
                }
                if (entry.type === 'frame') {
                    // Frame event — show even with 0 tags
                    const lowRes = entry.low_res ? ' <span style="color:#ff4757;">LOW RES</span>' : '';
                    div.style.color = entry.tags_found > 0 ? '#00d46a' : '#555';
                    div.innerHTML = `<span class="ts">${ts}</span> ` +
                        `<span class="cam">${entry.nvr}/ch${entry.ch}</span> ` +
                        `<span style="color:#666;">${entry.res || '?'}</span> ` +
                        `<span style="color:#888;">${entry.detect_ms}ms</span> ` +
                        `<span>${entry.tags_found > 0 ? entry.tags_found + ' tags' : 'no tags'}</span>` +
                        lowRes;
                } else {
                    // Tag detection event
                    const margin = entry.margin === 'aruco' ? 'aruco' : entry.margin;
                    div.innerHTML = `<span class="ts">${ts}</span> ` +
                        `<span class="cam">${entry.nvr}/ch${entry.ch}</span> ` +
                        `<span class="family">${entry.family}</span> ` +
                        `<span class="tag">#${entry.tag}</span> ` +
                        `<span class="size">${entry.size_px}px</span> ` +
                        `<span class="orient">${entry.orient_deg}&deg;</span> ` +
                        `<span class="margin">m:${margin}</span>`;
                }
                container.appendChild(div);
            }
            // Raw JSONL
            const rawContainer = document.getElementById('rawLines');
            for (const entry of log.lines) {
                const div = document.createElement('div');
                div.textContent = JSON.stringify(entry);
                rawContainer.appendChild(div);
            }
            if (rawAutoscroll) {
                document.getElementById('rawContainer').scrollTop =
                    document.getElementById('rawContainer').scrollHeight;
            }

            logOffset = log.nextOffset;
            totalLines += log.lines.length;
            document.getElementById('logCount').textContent = `${totalLines} lines`;

            if (autoscroll) {
                document.getElementById('logContainer').scrollTop =
                    document.getElementById('logContainer').scrollHeight;
            }
        }

        // Done
        if (!status.running) {
            clearInterval(pollInterval);
            pollInterval = null;
            resetControls();
            appendLogLine(`Scan complete \u2014 ${status.total_observations} observations, ${status.unique_tags} unique tags`);

            // Per-NVR FPS summary
            if (status.cameras && status.elapsed_s > 0) {
                const byNvr = {};
                for (const [key, cam] of Object.entries(status.cameras)) {
                    const nvr = key.split('/')[0];
                    if (!byNvr[nvr]) byNvr[nvr] = { frames: 0, channels: 0, tags: 0 };
                    byNvr[nvr].frames += cam.frames;
                    byNvr[nvr].channels += 1;
                    byNvr[nvr].tags += cam.unique_tags;
                }
                appendLogLine('');
                appendLogLine('Per-NVR throughput:');
                for (const [nvr, info] of Object.entries(byNvr).sort()) {
                    const fps = (info.frames / status.elapsed_s).toFixed(2);
                    appendLogLine(`  ${nvr}: ${info.frames} frames / ${status.elapsed_s}s = ${fps} fps  (${info.channels} ch, ${info.tags} tags)`);
                }
            }
        }
    } catch (e) {
        console.error('Poll error:', e);
    }
}

// ── Helpers ──

function appendLogLine(text, color) {
    const container = document.getElementById('logLines');
    const div = document.createElement('div');
    div.className = 'log-line';
    div.style.color = color || '#888';
    div.style.fontStyle = 'italic';
    div.textContent = text;
    container.appendChild(div);
    if (autoscroll) {
        document.getElementById('logContainer').scrollTop =
            document.getElementById('logContainer').scrollHeight;
    }
}

function toggleAutoscroll() {
    autoscroll = !autoscroll;
    document.getElementById('autoscrollBtn').textContent = `Auto-scroll: ${autoscroll ? 'ON' : 'OFF'}`;
}

function clearLog() {
    document.getElementById('logLines').innerHTML = '';
    totalLines = 0;
    document.getElementById('logCount').textContent = '0 lines';
}

function toggleRawAutoscroll() {
    rawAutoscroll = !rawAutoscroll;
    document.getElementById('rawAutoscrollBtn').textContent = `Auto-scroll: ${rawAutoscroll ? 'ON' : 'OFF'}`;
}

function clearRaw() {
    document.getElementById('rawLines').innerHTML = '';
}

// ── Init ──
loadCameras();
</script>
</body>
</html>
